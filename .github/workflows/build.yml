name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Build AutoGameInstaller.exe
        shell: pwsh
        run: >
          pyinstaller --onefile --windowed
          --name AutoGameInstaller
          --icon assets/icon.ico
          --add-data "assets/icon_512.png;assets"
          --hidden-import autoinstall
          --collect-submodules comtypes
          app.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AutoGameInstaller.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AutoGameInstaller.exe" | Out-File -Encoding ascii dist/AutoGameInstaller.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AutoGameInstaller
          path: dist/AutoGameInstaller.exe

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoGameInstaller.exe
            dist/AutoGameInstaller.exe.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
